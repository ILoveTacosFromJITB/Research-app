<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kino der Toten</title>
</head>
<body>
<!--ARTIFACT-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Special+Elite&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-bleed WebGL stage; menus are a left-anchored stack over a slow fly-through of the map; HUD pinned to the corners like the old round-based HUD. Single dark look on purpose. */
:root{
  --ink:#0a0807; --ink-2:#17110f; --ink-3:#241a17;
  --blood:#c4131f; --blood-dim:#6e0a12;
  --chalk:#ece4d2; --smoke:#8c837a; --brass:#d4a64c; --toxic:#5dff7a;
  --f-display:'Special Elite','Courier New',monospace;
  --f-hud:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-mark:'Permanent Marker','Marker Felt','Comic Sans MS',cursive;
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--chalk);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--f-hud);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.screen{position:fixed;inset:0;z-index:30}
.grain::after{content:"";position:absolute;inset:-50%;pointer-events:none;opacity:.09;
  background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,transparent 1px 3px),repeating-radial-gradient(circle at 73% 61%,#fff 0 1px,transparent 1px 4px);
  animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
@media (prefers-reduced-motion:reduce){.grain::after{animation:none}}

/* ---------- Loading ---------- */
#loading{background:var(--ink);display:grid;place-items:center;overflow:hidden}
.load-inner{position:relative;width:min(560px,calc(100% - 48px));display:grid;gap:18px;text-align:center}
.eyebrow{font-family:var(--f-hud);letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--smoke)}
.logo{font-family:var(--f-display);font-size:clamp(46px,11vw,92px);line-height:.9;color:var(--blood);
  letter-spacing:.04em;text-shadow:0 0 22px rgba(196,19,31,.45),2px 2px 0 #000;margin:0}
.logo small{display:block;font-size:.26em;letter-spacing:.42em;color:var(--chalk);text-shadow:none;margin-top:12px}
.flicker{animation:flicker 4s infinite}
@keyframes flicker{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.55}43%{opacity:1}77%{opacity:.85}78%{opacity:1}}
.bar{height:3px;background:var(--ink-3);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--blood);box-shadow:0 0 12px var(--blood);transition:width .25s}
.load-step{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
.tip{font-family:var(--f-display);font-size:15px;color:var(--chalk);opacity:.8;min-height:2.6em;text-wrap:balance}
.press{font-size:15px;letter-spacing:.35em;text-transform:uppercase;color:var(--chalk);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- Menu ---------- */
#menu{background:linear-gradient(90deg,rgba(10,8,7,.92) 0%,rgba(10,8,7,.7) 38%,rgba(10,8,7,0) 70%);
  padding:calc(24px + var(--sa-t)) calc(16px + var(--sa-r)) calc(20px + var(--sa-b)) calc(28px + var(--sa-l));
  display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:16px 40px;box-sizing:border-box}
#menu .logo{font-size:clamp(40px,7vw,68px);text-align:left;grid-column:1/-1}
#menu .logo small{font-size:.3em}
.menu-list{display:flex;flex-direction:column;gap:2px;align-self:start}
.menu-list button{text-align:left;font-size:clamp(22px,3.2vw,30px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 0 6px 22px;position:relative;color:var(--chalk);opacity:.82;transition:color .12s,opacity .12s,padding .12s}
.menu-list button::before{content:"";position:absolute;left:0;top:50%;width:10px;height:3px;background:var(--blood);transform:scaleX(0);transform-origin:left;transition:transform .12s}
.menu-list button:hover,.menu-list button.on,.menu-list button:focus-visible{color:var(--blood);opacity:1;padding-left:28px}
.menu-list button:hover::before,.menu-list button.on::before{transform:scaleX(1)}
.panel{align-self:start;max-width:520px;min-width:0;max-height:100%;overflow:auto;background:rgba(10,8,7,.82);
  border-left:3px solid var(--blood);padding:18px 20px;box-sizing:border-box}
.panel h2{margin:0 0 12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:18px;color:var(--brass)}
.panel p,.panel li{font-family:var(--f-display);font-size:14px;line-height:1.5;color:var(--chalk);opacity:.9}
.panel ul{margin:0;padding-left:18px}
.marquee{position:relative;padding:18px 18px 16px;background:var(--ink-2);border:2px solid var(--brass);
  box-shadow:inset 0 0 0 6px var(--ink-2),inset 0 0 0 8px rgba(212,166,76,.5)}
.marquee::before,.marquee::after{content:"";position:absolute;left:10px;right:10px;height:6px;
  background:radial-gradient(circle,#ffe6a8 0 2px,transparent 3px) 0 0/16px 6px repeat-x;animation:bulbs 1.2s steps(2) infinite}
.marquee::before{top:-4px}.marquee::after{bottom:-4px;animation-delay:.6s}
@keyframes bulbs{50%{opacity:.35}}
.marquee .mtitle{font-family:var(--f-display);font-size:28px;color:var(--chalk);letter-spacing:.06em}
.marquee .msub{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--brass);margin-top:2px}
.stats-row{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--smoke)}
.stats-row b{color:var(--chalk);font-weight:600}
.btn-main{display:inline-block;margin-top:14px;background:var(--blood);color:#fff;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  padding:12px 26px;font-size:17px;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
.btn-main:hover{background:#e01d2a}
.btn-ghost{display:inline-block;margin-top:14px;margin-left:8px;border:1px solid var(--smoke);padding:11px 20px;letter-spacing:.16em;text-transform:uppercase;font-size:14px}
.opt{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;align-items:center;gap:10px;margin:10px 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.opt input[type=range]{width:100%;accent-color:var(--blood)}
.opt select{background:var(--ink-3);color:var(--chalk);border:1px solid var(--smoke);padding:4px 6px;font:inherit}
.opt output{font-variant-numeric:tabular-nums;color:var(--brass);text-align:right}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.keys kbd{font-family:var(--f-hud);background:var(--ink-3);border:1px solid #3a2e29;padding:1px 7px;color:var(--brass);white-space:nowrap}
.keys span{font-family:var(--f-display)}
.foot{grid-column:1/-1;font-size:11px;letter-spacing:.12em;color:var(--smoke);text-transform:uppercase}
@media (max-width:760px),(max-height:520px){
  #menu{grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:8px 20px;padding-top:calc(12px + var(--sa-t))}
  #menu .logo{font-size:36px}
  .menu-list button{font-size:19px;padding:4px 0 4px 18px}
  .panel{padding:12px 14px}
  .marquee .mtitle{font-size:22px}
}
@media (max-height:520px){
  #menu .logo small{margin-top:6px}
  .panel p,.panel li{font-size:12.5px;line-height:1.4}
  .marquee{padding:10px 14px}
  .stats-row{margin:8px 0 0}
  .btn-main{margin-top:10px;padding:10px 22px}
}
body.touch #hud .br{bottom:auto;top:calc(10px + var(--sa-t));right:calc(70px + var(--sa-r))}
body.touch #points{font-size:24px}
body.touch #hint{top:auto;bottom:calc(36% + 12px)}
body.touch #ammo{font-size:26px}
@media (max-width:520px) and (orientation:portrait){
  #menu{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto}
}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud .bl{position:absolute;left:calc(22px + var(--sa-l));bottom:calc(16px + var(--sa-b));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#hud .br{position:absolute;right:calc(22px + var(--sa-r));bottom:calc(16px + var(--sa-b));text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#round{font-family:var(--f-mark);color:var(--blood);font-size:64px;line-height:1;text-shadow:0 0 10px rgba(196,19,31,.5),2px 2px 0 #000;min-height:64px}
#round svg{display:block;filter:drop-shadow(0 0 6px rgba(196,19,31,.6))}
#round.flash{animation:roundflash 3s}
@keyframes roundflash{0%,60%{color:#fff;filter:brightness(2)}100%{color:var(--blood)}}
#perks{display:flex;gap:6px}
.perk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;
  box-shadow:0 0 10px currentColor,inset 0 0 0 2px rgba(255,255,255,.35)}
.perk span{color:#fff;text-shadow:0 1px 2px #000}
#points{font-size:30px;font-weight:600;color:var(--brass);font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #000;position:relative}
.pop{position:absolute;right:0;bottom:100%;font-size:18px;color:var(--brass);animation:pop 1s ease-out forwards;white-space:nowrap}
@keyframes pop{to{transform:translate(-40px,-38px);opacity:0}}
#wname{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk);text-shadow:1px 1px 0 #000}
#wname.up{color:#c58bff}
#ammo{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #000;line-height:1}
#ammo small{font-size:20px;color:var(--smoke)}
#ammo.low b{color:var(--blood)}
#hint{position:absolute;left:50%;top:64%;transform:translateX(-50%);font-family:var(--f-display);font-size:17px;text-align:center;
  color:#fff;text-shadow:0 0 6px #000,1px 1px 0 #000;width:min(90vw,560px);text-wrap:balance}
#announce{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-family:var(--f-hud);font-weight:700;letter-spacing:.2em;
  font-size:clamp(22px,4vw,40px);color:var(--toxic);text-shadow:0 0 14px rgba(93,255,122,.6),2px 2px 0 #000;opacity:0;transition:opacity .4s;white-space:nowrap}
#announce.show{opacity:1}
#pups{position:absolute;left:50%;bottom:calc(20px + var(--sa-b));transform:translateX(-50%);display:flex;gap:10px}
.pup{border:2px solid var(--toxic);color:var(--toxic);padding:4px 10px;font-weight:700;letter-spacing:.1em;font-size:14px;background:rgba(0,0,0,.4)}
.pup.fade{animation:blink .4s infinite}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}
#cross .h{width:8px;height:2px;top:-1px}#cross .v{width:2px;height:8px;left:-1px}
#cross .l{left:calc(-8px - var(--gap))}#cross .r{left:var(--gap)}#cross .t{top:calc(-8px - var(--gap))}#cross .b{top:var(--gap)}
#cross.hide i{opacity:0}
#hitm{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
#hitm::before,#hitm::after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
#hitm::before{width:22px;height:2px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%,65% 0)}
#hitm::after{height:22px;width:2px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 0,0 65%,100% 65%,100% 100%,0 100%,0 65%)}
#hitm.on{animation:hm .18s}
#hitm.kill::before,#hitm.kill::after{background:var(--blood)}
@keyframes hm{0%{opacity:1}100%{opacity:0}}
#dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(150,0,0,.85) 100%);opacity:0}
#downed{position:absolute;inset:0;display:grid;place-items:center;background:rgba(80,0,0,.35);font-family:var(--f-display);font-size:28px;color:#fff;text-shadow:0 0 8px #000}
#notice{position:absolute;left:50%;top:calc(14px + var(--sa-t));transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(0,0,0,.55);padding:6px 12px;color:var(--chalk);white-space:nowrap}
#fps{position:absolute;left:calc(8px + var(--sa-l));top:calc(6px + var(--sa-t));font-size:11px;color:var(--smoke)}

/* ---------- Pause / Game over ---------- */
.overlay{background:rgba(10,8,7,.78);display:grid;place-items:center;padding:16px;box-sizing:border-box}
.overlay .box{text-align:center;display:grid;gap:10px;justify-items:center;max-width:520px}
.overlay h1{font-family:var(--f-display);color:var(--blood);font-size:clamp(40px,8vw,72px);margin:0;text-shadow:0 0 18px rgba(196,19,31,.5)}
.overlay p{font-family:var(--f-display);font-size:18px;margin:0}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.overlay .btn-ghost{margin:0}.overlay .btn-main{margin:0}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(20,14,12,.42);border:2px solid rgba(236,228,210,.35);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;touch-action:none}
#touch .tb.down{background:rgba(196,19,31,.55);border-color:var(--blood)}
#t-fire{width:84px;height:84px;right:calc(26px + var(--sa-r));bottom:calc(96px + var(--sa-b));font-size:14px}
#t-fire2{width:62px;height:62px;left:calc(30px + var(--sa-l));top:42%}
#t-ads{width:56px;height:56px;right:calc(128px + var(--sa-r));bottom:calc(150px + var(--sa-b))}
#t-reload{width:52px;height:52px;right:calc(120px + var(--sa-r));bottom:calc(76px + var(--sa-b))}
#t-use{width:64px;height:64px;right:calc(50%);transform:translateX(50%);bottom:18%;border-color:var(--brass)}
#t-knife{width:50px;height:50px;right:calc(36px + var(--sa-r));bottom:calc(196px + var(--sa-b))}
#t-swap{width:auto;height:auto;border-radius:6px;padding:8px 12px;right:calc(24px + var(--sa-r));bottom:calc(18px + var(--sa-b))}
#t-pause{width:40px;height:40px;right:calc(16px + var(--sa-r));top:calc(12px + var(--sa-t));border-radius:8px}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(236,228,210,.3);background:rgba(20,14,12,.25);display:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(236,228,210,.45)}
#stick.sprint{border-color:var(--brass)}
#rotate{position:fixed;inset:auto 0 calc(10px + var(--sa-b)) 0;text-align:center;z-index:40;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);pointer-events:none}
@media (orientation:landscape){#rotate{display:none}}
</style>

<div id="stage"></div>

<div id="hud" hidden>
  <div id="fps"></div>
  <div id="notice" hidden></div>
  <div id="dmg"></div>
  <div id="cross" style="--gap:6px"><i class="h l"></i><i class="h r"></i><i class="v t"></i><i class="v b"></i></div>
  <div id="hitm"></div>
  <div id="announce"></div>
  <div id="hint"></div>
  <div id="pups"></div>
  <div class="bl"><div id="perks"></div><div id="round"></div></div>
  <div class="br"><div id="points">500</div><div id="wname">M1911</div><div id="ammo"><b>8</b> <small>/ 80</small></div></div>
  <div id="downed" hidden>Reviving…</div>
</div>

<div id="touch" hidden>
  <div id="stick"><i></i></div>
  <div class="tb" id="t-pause" data-b="pause">II</div>
  <div class="tb" id="t-knife" data-b="knife">Knife</div>
  <div class="tb" id="t-ads" data-b="ads">Aim</div>
  <div class="tb" id="t-reload" data-b="reload">R</div>
  <div class="tb" id="t-fire" data-b="fire">Fire</div>
  <div class="tb" id="t-fire2" data-b="fire">Fire</div>
  <div class="tb" id="t-use" data-b="use" hidden>Use</div>
  <div class="tb" id="t-swap" data-b="swap">Swap</div>
</div>

<section id="loading" class="screen grain">
  <div class="load-inner">
    <div class="eyebrow">A fan-made round-based survival</div>
    <h1 class="logo flicker">ZOMBIES<small>KINO DER TOTEN</small></h1>
    <div class="bar"><i id="lbar"></i></div>
    <div class="load-step"><span id="lstep">Starting the projector</span><span id="lpct">0%</span></div>
    <div class="tip" id="ltip"></div>
    <div class="press" id="lpress" hidden>Press any key</div>
  </div>
</section>

<section id="menu" class="screen" hidden>
  <h1 class="logo">ZOMBIES<small>Round-based survival</small></h1>
  <nav class="menu-list" id="mlist">
    <button data-p="solo" class="on">Solo</button>
    <button data-p="options">Options</button>
    <button data-p="controls">Controls</button>
    <button data-p="about">About</button>
  </nav>
  <div class="panel" id="mpanel"></div>
  <div class="foot">Fan-made tribute, not affiliated with Activision or Treyarch.</div>
</section>

<section id="pause" class="screen overlay" hidden>
  <div class="box">
    <h1>Paused</h1>
    <p id="pstats"></p>
    <div class="row"><button class="btn-main" id="b-resume">Resume</button><button class="btn-ghost" id="b-restart">Restart</button><button class="btn-ghost" id="b-quit">Quit to menu</button></div>
  </div>
</section>

<section id="over" class="screen overlay" hidden>
  <div class="box">
    <h1>Game Over</h1>
    <p id="ostats"></p>
    <div class="stats-row" id="ostats2"></div>
    <div class="row"><button class="btn-main" id="b-again">Play again</button><button class="btn-ghost" id="b-menu">Main menu</button></div>
  </div>
</section>

<div id="rotate" hidden>Turn your phone sideways</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);

const store = {
  get(k, d) { try { const v = localStorage.getItem('kdt_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kdt_' + k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({ sens: 1, fov: 78, quality: isTouch ? 'low' : 'high', volume: 0.8, invertY: false, showFps: false }, store.get('settings', {}));

if (!window.THREE) {
  $('#lstep').textContent = 'Could not load the 3D engine. Check your connection and reload.';
  return;
}

// ---------------------------------------------------------------- RNG
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(1963);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

// ---------------------------------------------------------------- Renderer
const renderer = new THREE.WebGLRenderer({ antialias: settings.quality === 'high', powerPreference: 'high-performance' });
function applyPixelRatio() { renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, settings.quality === 'high' ? 2 : 1)); }
applyPixelRatio();
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
$('#stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060a);
scene.fog = new THREE.FogExp2(0x0b0909, 0.028);
const camera = new THREE.PerspectiveCamera(settings.fov, innerWidth / innerHeight, 0.05, 160);
camera.rotation.order = 'YXZ';
scene.add(camera);
const camLight = new THREE.PointLight(0xffe2c0, 0.35, 7, 1.5);
camera.add(camLight);

// viewmodel is drawn in its own pass so the gun never clips into walls
const vmScene = new THREE.Scene();

      <label class="opt"><span>Graphics</span><select id="o-q"><option value="low"${settings.quality === 'low' ? ' selected' : ''}>Performance</option><option value="high"${settings.quality === 'high' ? ' selected' : ''}>Quality</option></select><span></span></label>
      <label class="opt"><span>Invert look</span><input id="o-inv" type="checkbox"${settings.invertY ? ' checked' : ''}><span></span></label>
      <label class="opt"><span>Show FPS</span><input id="o-fps" type="checkbox"${settings.showFps ? ' checked' : ''}><span></span></label>`;
  },
  controls() {
    return `<h2>Controls</h2>
      <div class="keys">
        <kbd>W A S D</kbd><span>Move · hold Shift to sprint</span>
        <kbd>Mouse</kbd><span>Look · left click fire · right click aim</span>
        <kbd>F / E</kbd><span>Buy, open doors, take weapons · hold to rebuild barriers</span>
        <kbd>R</kbd><span>Reload</span><kbd>V / Q</kbd><span>Knife</span>
        <kbd>1 2 / Wheel</kbd><span>Switch weapon</span><kbd>Esc</kbd><span>Pause</span>
      </div>
      <h2 style="margin-top:16px">Touch</h2>
      <div class="keys">
        <kbd>Left thumb</kbd><span>Move · push far up to sprint</span>
        <kbd>Right thumb</kbd><span>Drag to look · drag on Fire to aim while shooting</span>
        <kbd>Use</kbd><span>Appears when you can buy or repair something</span>
        <kbd>Aim · R · Knife</kbd><span>Aim toggle, reload, melee · tap weapon name to swap</span>
      </div>`;
  },
  about() {
    return `<h2>How to survive</h2>
      <ul>
        <li>Zombies tear the boards off windows. Stand inside and hold Use to rebuild them for points.</li>
        <li>Every hit pays 10 points. A kill pays 50, plus 10 for a body shot or 50 for a headshot. Knife kills pay 130.</li>
        <li>The power switch is backstage. It opens the theater doors and wakes Juggernog, Speed Cola and Double Tap.</li>
        <li>With the power on, activate the mainframe on the stage, then link the pad in the lobby. The teleporter sends you to the projector room and its Pack-a-Punch for 30 seconds.</li>
        <li>Every few rounds the hellhounds come instead of zombies. The last one drops a Max Ammo.</li>
        <li>The Mystery Box costs 950. When the teddy bear shows up, it moves.</li>
        <li>Quick Revive works without power and gets you back up up to three times.</li>
      </ul>
      <p style="margin-top:12px;opacity:.7">A fan-made tribute built from scratch with Three.js and Web Audio. Every model, texture and sound is generated in code.</p>`;
  }
};
function showPanel(name) {
  document.querySelectorAll('#mlist button').forEach(b => b.classList.toggle('on', b.dataset.p === name));
  const p = $('#mpanel'); p.innerHTML = PANELS[name]();
  if (name === 'solo') $('#b-start').onclick = startGame;
  if (name === 'options') {
    const bind = (id, key, fmt, conv) => { const el = $('#' + id); el.oninput = () => { settings[key] = conv(el); const o = $('#' + id + '-v'); if (o) o.textContent = fmt(settings[key]); applySettings(); }; };
    bind('o-sens', 'sens', v => v.toFixed(1), el => +el.value); bind('o-fov', 'fov', v => v, el => +el.value); bind('o-vol', 'volume', v => Math.round(v * 100), el => +el.value);
    $('#o-q').onchange = e => { settings.quality = e.target.value; applySettings(); };
    $('#o-inv').onchange = e => { settings.invertY = e.target.checked; applySettings(); };
    $('#o-fps').onchange = e => { settings.showFps = e.target.checked; applySettings(); };
  }
}
function applySettings() {
  store.set('settings', settings); applyPixelRatio(); renderer.setSize(innerWidth, innerHeight);
  if (Snd.master) Snd.master.gain.value = settings.volume;
  camera.fov = settings.fov; camera.updateProjectionMatrix(); hud.fps.hidden = !settings.showFps;
}
document.querySelectorAll('#mlist button').forEach(b => { b.onclick = () => { audioInit(); SFX.startMusic(); showPanel(b.dataset.p); }; b.onmouseenter = () => tone({ f: 900, dur: .03, type: 'triangle', vol: .04 }); });
$('#b-resume').onclick = resume; $('#b-restart').onclick = () => { $('#pause').hidden = true; startGame(); }; $('#b-quit').onclick = quitToMenu;
$('#b-again').onclick = startGame; $('#b-menu').onclick = quitToMenu;
function goMenu() {
  audioInit(); SFX.startMusic();
  G_.state = 'menu'; doorObjs.P.mesh.visible = false; $('#loading').hidden = true; $('#menu').hidden = false; showPanel('solo');
}
function checkRotate() { $('#rotate').hidden = !(isTouch && innerHeight > innerWidth && G_.state !== 'loading'); }

// menu camera fly-through
const flyPath = [[16.5, 31, 0, 1.7], [16.5, 25, 0, 1.9], [16.5, 19, -.2, 2.2], [20, 12, .4, 2.6], [16.5, 6, 3.14, 2.4], [12, 14, 2.6, 2.2], [16.5, 24, 3.14, 1.9]].map(([x, y, yaw, h]) => { const c = mc(x, y); return { x: c.x, z: c.z, yaw, h }; });
function menuCamera(t) {
  const n = flyPath.length, u = (t * .045) % n, i = Math.floor(u), f = u - i, a = flyPath[i], b = flyPath[(i + 1) % n];
  const s = f * f * (3 - 2 * f);
  camera.position.set(lerp(a.x, b.x, s), lerp(a.h, b.h, s), lerp(a.z, b.z, s));
  let dy = b.yaw - a.yaw; while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2;
  camera.rotation.set(-.05 + Math.sin(t * .3) * .03, a.yaw + dy * s, 0);
  if (Math.abs(camera.fov - settings.fov) > .05) { camera.fov = settings.fov; camera.updateProjectionMatrix(); }
}

// ---------------------------------------------------------------- Main loop
function update(dt) {
  G_.time += dt;
  updateTimers(dt);
  updatePlayer(dt);
  computeFlow(false);
  updateRound(dt);
  for (let i = zombies.length - 1; i >= 0; i--) updateZombie(zombies[i], dt);
  separateZombies();
  updateInteract(dt); updateBox(dt); updatePowerups(dt); updateParticles(dt); updateTracers(dt); updateBlasts(dt); updateWorldFx(dt); hudPups();
}
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  fpsAcc += dt; fpsN++; if (fpsAcc > .5) { if (settings.showFps) hud.fps.textContent = Math.round(fpsN / fpsAcc) + ' fps'; fpsAcc = 0; fpsN = 0; }
  if (G_.state === 'loading') return;
  if (G_.state === 'playing') update(dt);
  else if (G_.state === 'menu' || G_.state === 'title') {
    G_.time += dt; menuCamera(G_.time); updateWorldFx(dt);
  } else if (G_.state === 'over') {
    G_.time += dt; for (let i = zombies.length - 1; i >= 0; i--) { const z = zombies[i]; if (!z.dead) { z.m.armL.rotation.x = z.m.armR.rotation.x = -1.4 + Math.sin(G_.time * 3 + i) * .2; } else updateZombie(z, dt); }
    camera.position.y = lerp(camera.position.y, .4, dt * 2); camera.rotation.z = lerp(camera.rotation.z, .5, dt * 2);
  }
  renderer.clear();
  renderer.render(scene, camera);
  if (G_.state === 'playing' || G_.state === 'paused') { renderer.clearDepth(); renderer.render(vmScene, vmCam); }
}

// ---------------------------------------------------------------- Loading
const TIPS = [
  'Rebuilding barriers between rounds pays 10 points per board.',
  'Aim for the head. Headshot kills are worth 100 points.',
  'The knife is your best friend in the first two rounds.',
  'Turn on the power backstage to wake the perk machines.',
  'Link the mainframe on stage to the lobby pad to reach Pack-a-Punch.',
  'When the fog turns red, the hellhounds are coming.',
  'Juggernog lets you take five hits instead of two.',
  'When the teddy bear appears, the Mystery Box moves somewhere else.',
  'Max Ammo refills every weapon you carry.'
];
async function load() {
  const steps = [
    ['Painting the walls', buildTextures], ['Mixing the materials', buildMaterials], ['Building Kino der Toten', buildWorld],
    ['Stocking the perk machines', buildProps], ['Waking the dead', buildZombieAssets], ['Loading weapons', buildViewmodelExtras],
    ['Compiling shaders', () => { resetGame(); G_.state = 'menu'; menuCamera(0); renderer.compile(scene, camera); renderer.render(scene, camera); G_.state = 'loading'; }],
  ];
  $('#ltip').textContent = pick(TIPS);
  for (let i = 0; i < steps.length; i++) {
    $('#lstep').textContent = steps[i][0];
    await new Promise(r => setTimeout(r, 120));
    steps[i][1]();
    const pct = Math.round((i + 1) / steps.length * 100); $('#lbar').style.width = pct + '%'; $('#lpct').textContent = pct + '%';
    if (i === 3) $('#ltip').textContent = pick(TIPS);
  }
  $('#lstep').textContent = 'Ready';
  if (isTouch) { setupTouch(); document.body.classList.add('touch'); }
  hud.fps.hidden = !settings.showFps;
  $('#lpress').textContent = isTouch ? 'Tap to continue' : 'Press any key';
  $('#lpress').hidden = false; G_.state = 'title';
  const go = () => { if (G_.state === 'title') goMenu(); };
  $('#loading').addEventListener('click', go); $('#loading').addEventListener('touchend', e => { e.preventDefault(); go(); });
}
hud.wname.style.pointerEvents = 'auto';
hud.wname.addEventListener('click', swapWeapon);
hud.wname.addEventListener('touchstart', e => { e.preventDefault(); swapWeapon(); }, { passive: false });
requestAnimationFrame(frame);
load().catch(err => { console.error(err); $('#lstep').textContent = 'Something went wrong while loading: ' + err.message; });
// test hook
window.__kdt = { G: G_, P, zombies, windows, doorOpen, startGame, powerOn, openDoor, spawnPowerup, startRound, rayWall, get hits() { return hitMeshes; }, camera, input, get box() { return box; }, interactables, tryFire, perks: PERKS,
  sim(n, dt = 1 / 30, each) { for (let i = 0; i < n && G_.state === 'playing'; i++) { if (each) each(); update(dt); camera.updateMatrixWorld(); scene.updateMatrixWorld(); } } };
})();
</script>
