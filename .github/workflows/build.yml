name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ResellComps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ResellComps-apk
          path: ResellComps.apk

      # Replace the previous build's release so the new one is dated today and listed at the top.
      - name: Remove previous build release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "latest-${{ github.ref_name }}" --cleanup-tag --yes || true

      - name: Build date
        id: date
        run: echo "stamp=$(date -u '+%b %d, %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # A downloadable "latest" release so the APK can be grabbed straight from a phone browser.
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Resell Comps — newest build (${{ steps.date.outputs.stamp }})
          prerelease: false
          make_latest: true
          files: ResellComps.apk
          body: |
            Built from ${{ github.sha }}.
            On your Android phone: download ResellComps.apk, open it, and allow installing from your browser when asked.
