name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ResellComps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ResellComps-apk
          path: ResellComps.apk

      # A downloadable "latest" release so the APK can be grabbed straight from a phone browser.
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Latest build (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          files: ResellComps.apk
          body: |
            Built from ${{ github.sha }}.
            On your Android phone: download ResellComps.apk, open it, and allow installing from your browser when asked.
